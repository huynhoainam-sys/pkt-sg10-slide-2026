<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SG10 | Review 7 slide KPI tháng 10/2026</title><style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#eaf5ff;background:#07182d;--orange:#ff8c3e;--cyan:#6bdbff;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 5%,#1264a633,transparent 55%),#07182d}.app{width:min(1440px,97vw);margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;color:#a8cbde;font-size:13px}.brand{font-weight:850;color:#fff;letter-spacing:1.5px}.brand b{color:var(--orange)}.stage{position:relative;aspect-ratio:16/9;border:1px solid #4ca9d055;border-radius:17px;overflow:hidden;box-shadow:0 22px 80px #0007;background:linear-gradient(140deg,#0e365a,#0a2442 56%,#092039)}section{display:none;position:absolute;inset:0;padding:3.4% 4.2%;overflow:hidden}section.active{display:block}section:before{content:"";position:absolute;right:-4%;top:-20%;width:45%;height:80%;background:radial-gradient(circle,#249cd016,transparent 65%);pointer-events:none}.eyebrow{font-size:clamp(9px,1vw,14px);font-weight:800;letter-spacing:2px;color:#81daee}h1{margin:1.1% 0 .8%;font-size:clamp(21px,3.1vw,44px);line-height:1.12;letter-spacing:-.7px}h1 span{color:var(--orange)}.sub{margin:0 0 2.1%;font-size:clamp(11px,1.2vw,17px);color:#bdd2e7}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1%}.card,.panel{border:1px solid #9fd2ef29;background:#123b5b9c;border-radius:12px;padding:1.65%;min-width:0}.card b{display:block;font-size:clamp(12px,1.32vw,19px);color:#fff;margin-bottom:8px}.card .value{font-size:clamp(15px,2.1vw,31px);font-weight:900;color:#87e6ff}.card p{margin:7px 0 0;font-size:clamp(9px,1.03vw,15px);line-height:1.4;color:#c3d8e9}.panel{margin-top:1.5%;padding:1.7%}.panel h2{font-size:clamp(13px,1.5vw,21px);margin:0 0 1.2%;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.5%}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:1.3%}.metric{font-size:clamp(16px,2.3vw,34px);font-weight:900;color:#93ddff}.muted{color:#bdd2e7;font-size:clamp(10px,1vw,14px)}table{border-collapse:collapse;width:100%;font-size:clamp(10px,1.1vw,16px)}th,td{border:1px solid #7dbbda35;text-align:left;padding:1% 1.15%}th{background:#1b5277;color:#e6f7ff}td{background:#123550}.empty{padding:3%;text-align:center;color:#9bc4dc;background:#102c45;border:1px dashed #648dad;border-radius:9px;margin-top:1%}.status{color:#ffc38c;font-weight:750}.foot{position:absolute;bottom:2.2%;left:4.2%;right:4.2%;border-top:1px solid #8db6d631;padding-top:1%;display:flex;justify-content:space-between;color:#8bacc4;font-size:clamp(9px,.9vw,13px)}.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0}.controls button{border:1px solid #6ca9c866;border-radius:9px;color:#e5f5ff;background:#17415f;font:inherit;font-weight:700;padding:12px 23px;cursor:pointer}.controls button:hover{background:#245979}.count{min-width:70px;text-align:center;font-weight:800}.smallnote{color:#a1bdd1;font-size:12px;text-align:center}.rule{border-left:4px solid #ff9847;padding-left:13px;color:#f6d9b8;font-size:clamp(11px,1.15vw,16px)}.pill{display:inline-block;background:#f3702133;border:1px solid #f5a26266;padding:5px 10px;border-radius:22px;color:#ffd3b0;font-size:clamp(9px,.95vw,13px)}@media(max-width:680px){.app{width:100%;padding:8px}.stage{aspect-ratio:9/12}section{padding:5%}.cards{grid-template-columns:repeat(2,1fr);gap:8px}.grid5{grid-template-columns:repeat(2,1fr);gap:8px}.grid2{grid-template-columns:1fr}.card,.panel{padding:9px}h1{font-size:21px}.sub{font-size:11px}.foot{bottom:12px}table{font-size:10px}th,td{padding:7px 5px}.controls button{padding:10px 16px}}@media print{body{background:white}.top,.controls,.smallnote{display:none}.stage{border:0;box-shadow:none;overflow:visible;aspect-ratio:auto}.stage section{display:block;position:relative;aspect-ratio:16/9;page-break-after:always;background:#0e3150}.app{width:100%;padding:0}@page{size:landscape;margin:0}}
</style></head><body><main class="app"><div class="top"><div class="brand"><b>FPT</b> TELECOM · PKT SG10</div><div>REVIEW / TỔNG KẾT THÁNG 10.2026</div></div><div class="stage" id="stage"></div><div class="controls"><button id="prev" aria-label="Slide trước">← Trước</button><span class="count" id="count">01 / 07</span><button id="next" aria-label="Slide sau">Tiếp →</button></div><div class="smallnote">Bản review nội dung · số chưa kiểm chứng hiển thị “Chờ đối soát” · phím ← → để chuyển slide</div></main><script>
const slides=[{"tag":"QUY ĐỊNH","title":"NHẮC LẠI RANKING KỸ THUẬT","desc":"4 tiêu chí · KTV đạt khi có ít nhất 3/4 tiêu chí đạt","type":"ranking"},{"tag":"QUY ĐỊNH","title":"NHẮC LẠI KPI CHUNG KỸ THUẬT","desc":"Một bộ KPI thống nhất cho vận hành, chất lượng và phát triển thuê bao","type":"common"},{"tag":"BÁO CÁO NHÂN SỰ","title":"THU HỒI · THẤP NHẤT ĐẾN CAO NHẤT","desc":"Ưu tiên nhận diện KTV có tỷ lệ thu hồi thấp nhất; tách thu hồi công nợ và thu hồi thiết bị","type":"recovery"},{"tag":"CHẤT LƯỢNG","title":"CLL · CAO NHẤT ĐẾN THẤP NHẤT","desc":"Nhân sự có tỷ lệ CLL2 cao nhất được đặt đầu bảng để ưu tiên xử lý","type":"cll"},{"tag":"CHẤT LƯỢNG","title":"TỶ LỆ RM THEO NHÂN SỰ","desc":"RM thực tế, khác với chỉ số nguy cơ RM trong Ranking","type":"rm"},{"tag":"PHÁT TRIỂN","title":"KẾT QUẢ PTTB THEO NHÂN SỰ","desc":"Online, tỷ lệ hoàn thành và đóng góp theo Đội trưởng","type":"pttb"},{"tag":"KẾT LUẬN","title":"TỔNG QUAN 5 TRỌNG TÂM SG10","desc":"PTTB · Đúng hẹn · CLL · Ranking · Thu hồi","type":"overview"}];
const source={ranking:"https://docs.google.com/spreadsheets/d/1Zjl5S06nUoYPWw8y-qq4oWZhSvlozIhDV63hNWENgdE/edit",cll:"https://docs.google.com/spreadsheets/d/1ZSdo1BmTdgv-OLiCHzeiYBNmXn5G0XcZ4UQJI3T2ykg/edit"};
const table=(headers,empty="Đang đối soát dữ liệu nhân sự tháng 10/2026")=>'<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead></table><div class="empty">'+empty+'</div>';
const card=(a,b,c)=>'<div class="card"><b>'+a+'</b><div class="value">'+b+'</div><p>'+c+'</p></div>';
const panel=(title,content)=>'<div class="panel"><h2>'+title+'</h2>'+content+'</div>';
function render(type){
switch(type){
case "ranking":return '<div class="cards">'+card('01 · WiFi xấu','Không tăng','Kỳ báo cáo ≤ kỳ so sánh')+card('02 · Nguy cơ RM','< 25%','Không phải tỷ lệ RM thực tế')+card('03 · CLL2','≤ 6%','Tỷ lệ CLL2 theo nguồn Ranking')+card('04 · Không xem TV','< 30%','Tỷ lệ trên AU Combo')+'</div>'+panel('ĐIỀU KIỆN XẾP LOẠI','<p class="rule"><b>KTV đạt khi đạt ít nhất 3/4 tiêu chí.</b> KTV Pro và Đội trưởng sử dụng quy tắc đánh giá riêng; không dùng chung kết luận KTV.</p><p class="muted">Nguồn: cấu hình Ranking SG10. Trạng thái tháng 10 cần xác nhận đã chốt trước khi đưa tỷ lệ đạt.</p>');
case "common":return '<div class="cards">'+card('THU HỒI','CN30 / CN60','Tỷ lệ thu hồi, tồn cuối kỳ, số bill')+card('CHẤT LƯỢNG','CLL / CLDV','CLL2–CLL3 và đánh giá khách hàng')+card('DUY TRÌ','RM','Tỷ lệ rời mạng thực tế theo KTV')+card('PHÁT TRIỂN','PTTB','Online thực tế, tỷ lệ đạt chỉ tiêu')+'</div>'+panel('ĐÚNG HẸN TRIỂN KHAI & BẢO TRÌ','<div class="grid2"><div>'+card('Triển khai đúng hẹn','Chờ đối soát','Mẫu số là tác vụ đến hạn hợp lệ')+'</div><div>'+card('Bảo trì đúng hẹn','Chờ đối soát','Theo quy tắc SLA nguồn')+'</div></div>');
case "recovery":return '<div class="grid2">'+card('Tỷ lệ thu hồi SG10','Chờ đối soát','Không gộp thu hồi công nợ và thiết bị')+card('Sắp xếp','THẤP → CAO','Ưu tiên cá nhân thu hồi thấp, có tồn lớn')+'</div>'+panel('BẢNG XẾP HẠNG KTV · TỶ LỆ THU HỒI TĂNG DẦN',table(['STT','Đội trưởng','KTV','Tồn đầu kỳ','Đã thu','Còn tồn','Tỷ lệ TH']))+'<p class="muted">Đối chiếu CN30/CN60, số lượng giao thu và hoàn thành. Trường không có mẫu số để “N/A”, không coi là 0%.</p>');
case "cll":return '<div class="grid2">'+card('Ngưỡng CLL2','≤ 6%','Theo cấu hình Ranking')+card('Sắp xếp','CAO → THẤP','Tỷ lệ CLL2 cao nhất xuất hiện đầu')+'</div>'+panel('BẢNG NHÂN SỰ · CLL2 GIẢM DẦN',table(['STT','Đội trưởng','KTV','CLBT hợp lệ','CLL2','Tỷ lệ CLL2','CLL3','Đánh giá']))+'<p class="muted">CLL3 hiển thị số ca riêng; không cộng trực tiếp vào tỷ lệ CLL2. Dữ liệu nguồn tháng 10 cần chốt.</p>');
case "rm":return '<div class="grid2">'+card('Tỷ lệ RM thực tế','Chờ đối soát','Số hợp đồng RM / mẫu số hợp lệ')+card('Thứ tự cảnh báo','CAO → THẤP','Ưu tiên tỷ lệ RM xấu nhất')+'</div>'+panel('RM THEO KTV · CAO NHẤT TRƯỚC',table(['STT','Đội trưởng','KTV','Tổng HĐ','HĐ RM','Tỷ lệ RM','RM 3/6/12T']))+'<p class="muted">Dùng nhân sự triển khai thực tế từ dữ liệu TKM, không map bằng tài khoản hoàn tất. Không thay thế bằng nguy cơ RM trong Ranking.</p>');
case "pttb":return '<div class="grid2">'+card('PTTB Online tháng 10','Chờ đối soát','Không dùng thành tích Kickoff tháng 9')+card('Tỷ lệ nhân sự có bán','Chờ đối soát','Số KTV có Online / tổng KTV phù hợp')+'</div>'+panel('KẾT QUẢ THEO KTV & ĐỘI TRƯỞNG',table(['STT','Đội trưởng','KTV','Chỉ tiêu','PTTB Online','TL hoàn thành','Trạng thái']))+'<p class="muted">Tách PTTB bán vào và PTTB Online; thưởng chỉ tính khi đủ điều kiện chương trình, gồm Online T+3 nếu áp dụng.</p>');
case "overview":return '<div class="grid5">'+card('PTTB','Chờ đối soát','Online và tỷ lệ đạt kế hoạch')+card('ĐÚNG HẸN','Chờ đối soát','Triển khai / Bảo trì')+card('CLL','Chờ đối soát','CLL2 và số CLL3')+card('RANKING','Chờ chốt kỳ','KTV đạt / tổng KTV')+card('THU HỒI','Chờ đối soát','CN30/CN60 và tồn')+'</div>'+panel('CHỐT TRỌNG TÂM THÁNG 11','<p class="rule">Đội trưởng theo sát KTV ở cuối bảng thu hồi, đầu bảng CLL và RM; hỗ trợ nhân sự PTTB thấp; kiểm soát tác vụ đúng hẹn hằng ngày.</p><p class="muted">Đội trưởng theo thứ tự: KhangTV1 → LocLV2 → SangH → ThinhPT → KhanhLQ3.</p>');
}};
const stage=document.getElementById('stage');
stage.innerHTML=slides.map((s,i)=>'<section class="'+(i===0?'active':'')+'" aria-label="Slide '+(i+1)+'"><div class="eyebrow">PKT SG10 · '+s.tag+' <span class="pill" style="float:right">'+String(i+1).padStart(2,'0')+' / 07</span></div><h1>'+s.title+'</h1><p class="sub">'+s.desc+'</p>'+render(s.type)+'<div class="foot"><span>FPT TELECOM · PHÒNG KỸ THUẬT SG10</span><span>REVIEW 02.11.2026 · CHƯA PUBLISH</span></div></section>').join('');
let current=0;function show(n){current=(n+slides.length)%slides.length;document.querySelectorAll('section').forEach((x,i)=>x.classList.toggle('active',i===current));document.getElementById('count').textContent=String(current+1).padStart(2,'0')+' / 07'};document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
</script></body></html>
