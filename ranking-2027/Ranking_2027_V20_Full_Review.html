<body>
  <div class="app" id="app">
    <div class="viewport" id="viewport" aria-label="Khung trình chiếu Ranking KTV 2027">
      <div class="canvas" id="canvas" role="main"></div>
    </div>
    <nav class="transport" aria-label="Điều khiển trình chiếu">
      <div class="transport-brand"><span class="mark">F<span>P</span>T</span><span class="transport-title">RANKING KTV <b>2027</b></span></div>
      <div class="transport-center">
        <button type="button" class="nav-btn" id="prevBtn" aria-label="Slide trước" title="Slide trước (←)"><span aria-hidden="true">←</span></button>
        <button type="button" class="progress-button" id="outlineBtn" title="Mở mục lục" aria-label="Mở mục lục">
          <span class="progress-track"><span id="progressFill"></span></span>
          <span class="page-count" id="pageCount">01 / 18</span>
        </button>
        <button type="button" class="nav-btn" id="nextBtn" aria-label="Slide tiếp theo" title="Slide tiếp theo (→)"><span aria-hidden="true">→</span></button>
      </div>
      <div class="transport-right">
        <button type="button" class="plain-btn" id="sourceBtn" title="Xem nội dung tham chiếu gốc" aria-label="Xem slide tài liệu gốc">Tài liệu gốc <span aria-hidden="true">↗</span></button>
        <button type="button" class="icon-btn" id="menuBtn" title="Mục lục (M)" aria-label="Mở mục lục">☷</button>
        <button type="button" class="icon-btn" id="fullBtn" title="Toàn màn hình (F)" aria-label="Toàn màn hình">⛶</button>
      </div>
    </nav>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Mục lục bài trình chiếu" aria-hidden="true">
    <header class="drawer-head"><div><span class="eyebrow">NỘI DUNG ĐÀO TẠO</span><h2>18 slide<br>Ranking 2027</h2></div><button type="button" class="dialog-x" data-close aria-label="Đóng mục lục">×</button></header>
    <div class="outline-list" id="outlineList"></div>
    <div class="drawer-note">Chuyển slide bằng phím ← → · Nhấn F để toàn màn hình · Esc để đóng</div>
  </aside>
  <aside class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" aria-hidden="true">
    <header class="detail-top"><span class="eyebrow" id="detailEyebrow">NỘI DUNG CHI TIẾT</span><button type="button" class="dialog-x" data-close aria-label="Đóng chi tiết">×</button></header>
    <div class="detail-scroll"><h2 id="detailTitle"></h2><div id="detailContent"></div></div>
    <footer class="detail-bottom"><span>SG10 · FTEL | RANKING 2027</span><button type="button" class="detail-close" data-close>Quay lại slide <span>↗</span></button></footer>
  </aside>
  <div class="image-viewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="Xem ảnh tài liệu gốc" aria-hidden="true" hidden>
    <header class="viewer-topbar">
      <div class="viewer-title"><span class="viewer-kicker">TÀI LIỆU THAM CHIẾU</span><strong id="viewerTitle">Slide gốc</strong></div>
      <div class="viewer-toolbar" aria-label="Điều khiển phóng ảnh">
        <button type="button" id="zoomOut" title="Thu nhỏ (-)" aria-label="Thu nhỏ">−</button>
        <span id="zoomLabel" aria-live="polite">100%</span>
        <button type="button" id="zoomIn" title="Phóng to (+)" aria-label="Phóng to">+</button>
        <button type="button" id="zoomReset" title="Vừa màn hình (0)">Vừa khung</button>
        <button type="button" class="viewer-close" id="closeViewer" title="Quay lại nội dung chi tiết (Esc)">✕</button>
      </div>
    </header>
    <div class="viewer-stage" id="viewerStage"><img src="" alt="Slide PowerPoint gốc ở kích thước lớn" id="viewerImage" draggable="false"></div>
    <footer class="viewer-footer">Cuộn chuột để phóng to / thu nhỏ · Giữ và kéo ảnh để di chuyển · Nhấn Esc quay về chi tiết</footer>
  </div>
